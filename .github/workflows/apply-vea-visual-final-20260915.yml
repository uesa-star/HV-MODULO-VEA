name: Aplicar visual final VEA S.E.36

on:
  push:
    branches:
      - vea-se36-final-blindado-20260915
    paths:
      - '.github/workflows/apply-vea-visual-final-20260915.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vea-se36-final-blindado-20260915
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Aplicar cambios aprobados
        run: python scripts/apply_vea_visual_final_20260915.py
      - name: Validar estructura crítica
        run: |
          grep -q 'F6_20_MASTER_DINAMICO_CACHE_V2' index.html
          grep -q 'VEA_PLUGIN_VALORES_BARRAS_F503' index.html
          grep -q 'VEA_VISUAL_FINAL_APROBADO_20260915' index.html
          grep -q 'VEA_PLUGIN_CONTRASTE_GRAFICOS_20260915' index.html
          grep -q 'Última sincronización: lunes 14.Sep.2026 - 01:00 p. m. · S.E. 36' index.html
      - name: Commit del INDEX final
        run: |
          git config user.name 'uesa-star'
          git config user.email 'uesa@hospitaldeventanilla.gob.pe'
          git add index.html
          if git diff --cached --quiet; then
            echo 'Sin cambios pendientes'
          else
            git commit -m 'VEA: aplicar versión visual final S.E.36'
            git push origin HEAD:vea-se36-final-blindado-20260915
          fi

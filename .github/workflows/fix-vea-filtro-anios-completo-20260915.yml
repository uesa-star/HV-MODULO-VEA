name: VEA corregir filtro completo de años

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-years:
    if: ${{ !contains(github.event.head_commit.message, 'VEA: publicar filtro completo de años') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Corregir regla de años y presentación del dropdown
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          old="""function tresAniosMasRecientesVea(anios) {
            return normalizarListaAniosVea(anios).sort((a, b) => b - a).slice(0, 3).sort((a, b) => a - b);
        }"""
          new="""function tresAniosMasRecientesVea(anios) {
            // Compatibilidad histórica: el filtro visible debe ofrecer TODOS los años disponibles.
            return normalizarListaAniosVea(anios).sort((a, b) => a - b);
        }"""
          if old in s:
              s=s.replace(old,new,1)
          elif 'VEA_FIX_FILTRO_ANIOS_COMPLETO_20260915' not in s:
              raise SystemExit('No se encontró la regla de tres años ni el marcador de corrección')

          css='''
          <style id="vea-fix-filtro-anios-visual-20260915">
          /* VEA_FIX_FILTRO_ANIOS_COMPLETO_20260915 */
          #dropdownAniosContent{
            width:100%!important;
            max-height:22rem!important;
            overflow-y:auto!important;
            overflow-x:hidden!important;
            box-sizing:border-box!important;
            z-index:80!important;
          }
          #dropdownAniosContent label{
            min-height:2.45rem;
            box-sizing:border-box;
          }
          #dropdownAniosContent::-webkit-scrollbar{width:5px}
          @media(max-width:767px){
            #dropdownAniosContent{max-height:18rem!important}
          }
          </style>
          '''
          if 'vea-fix-filtro-anios-visual-20260915' not in s:
              s=s.replace('</head>',css+'\n</head>',1)

          marker='VEA_FIX_FILTRO_ANIOS_COMPLETO_20260915'
          if marker not in s:
              s=s.replace('</head>',f'<!-- {marker} -->\n</head>',1)

          if 'F6_20_MASTER_DINAMICO_CACHE_V2' not in s:
              raise SystemExit('Firma F6.20 ausente')
          if 'return normalizarListaAniosVea(anios).sort((a, b) => a - b);' not in s:
              raise SystemExit('La regla completa de años no quedó aplicada')
          p.write_text(s,encoding='utf-8')
          print('OK: todos los años + dropdown visual estable')
          PY
      - name: Validar
        run: |
          grep -q 'VEA_FIX_FILTRO_ANIOS_COMPLETO_20260915' index.html
          grep -q 'return normalizarListaAniosVea(anios).sort((a, b) => a - b);' index.html
          grep -q 'F6_20_MASTER_DINAMICO_CACHE_V2' index.html
      - name: Publicar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'Sin cambios'
            exit 0
          fi
          git commit -m 'VEA: publicar filtro completo de años'
          git push

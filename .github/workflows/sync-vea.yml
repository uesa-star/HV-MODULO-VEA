name: Sincronización VEA desde Google Drive

# Automatización horaria segura (hora de Perú, UTC-5):
# Revisa el Master en Google Drive cada hora.
# Solo sincroniza Supabase cuando Google Drive reporta un cambio.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sync-vea.yml"
      - "scripts/sync_vea.py"
      - "scripts/sync_vea_guard.py"
      - "requirements-sync.txt"

permissions:
  contents: read

concurrency:
  group: vea-sync
  cancel-in-progress: false

jobs:
  sync-vea:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements-sync.txt

      - name: Revisar y sincronizar solo si Google Drive cambió
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_DRIVE_FILE_ID: "1TJaDJ5U7M3RZYgfAR6LI3kFTABBH0UYb"
        shell: bash
        run: |
          set -e
          for intento in 1 2 3; do
            echo "Revisión/sincronización VEA: intento ${intento}/3"
            if python scripts/sync_vea_guard.py; then
              echo "Proceso VEA completado correctamente."
              break
            fi
            if [ "$intento" -eq 3 ]; then
              echo "ERROR: el proceso VEA falló después de 3 intentos."
              exit 1
            fi
            sleep 20
          done

      - name: Verificar tablas sincronizadas
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python - <<'PY'
          import os
          import sys
          import requests

          base = os.environ["SUPABASE_URL"].rstrip("/")
          key = os.environ["SUPABASE_SERVICE_ROLE_KEY"]
          headers = {
              "apikey": key,
              "Authorization": f"Bearer {key}",
              "Prefer": "count=exact",
          }
          obligatorias = ["edas", "iras", "febriles", "individual", "soat"]
          fallos = []

          for tabla in obligatorias:
              try:
                  r = requests.get(
                      f"{base}/rest/v1/{tabla}",
                      headers=headers,
                      params={"select": "_row_id", "limit": "1"},
                      timeout=60,
                  )
                  if r.status_code >= 300:
                      fallos.append(f"{tabla}: HTTP {r.status_code}")
                      print(f"FAIL {tabla}: HTTP {r.status_code} {r.text[:200]}")
                  else:
                      print(f"OK {tabla}: {r.headers.get('content-range', '?')}")
              except Exception as exc:
                  fallos.append(f"{tabla}: {exc}")
                  print(f"FAIL {tabla}: {exc}")

          if fallos:
              print("VERIFICACIÓN FALLIDA:")
              for item in fallos:
                  print(f" - {item}")
              sys.exit(1)
          print("VERIFICACIÓN OK: las tablas obligatorias responden.")
          PY

name: VEA - corregir layout filtros y corrupción de script

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-dashboard-layout-corruption-20260916.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Corregir INDEX de forma controlada
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          original = s

          # 1) CRÍTICO: el </script> interno del boletín cerraba prematuramente
          # el script principal y dejaba el resto del JavaScript visible como texto.
          old = """  window.addEventListener('load',()=>{aplicar();setTimeout(aplicar,600);setTimeout(aplicar,1800)});
  })();
</script>
</body></html>`;"""
          new = """  window.addEventListener('load',()=>{aplicar();setTimeout(aplicar,600);setTimeout(aplicar,1800)});
  })();
<\\/script>
</body></html>`;"""
          if old not in s:
              raise SystemExit('ERROR: no se encontró el cierre interno del boletín.')
          s = s.replace(old, new, 1)

          # 2) Alineación del bloque de filtros: año, mes y semana con una
          # proporción estable y acciones independientes a la derecha.
          old_grid = 'grid grid-cols-1 md:grid-cols-2 lg:grid-cols-[1fr_1fr_1fr_auto] gap-4 lg:items-end'
          new_grid = 'grid vea-filtros-dashboard-grid grid-cols-1 md:grid-cols-2 lg:grid-cols-[1.15fr_1fr_1fr_auto] gap-4 lg:items-end'
          if old_grid not in s:
              raise SystemExit('ERROR: no se encontró el grid principal de filtros.')
          s = s.replace(old_grid, new_grid, 1)

          # 3) Alturas y alineación visual homogéneas en la fila de filtros.
          css = r'''
<style id="vea-fix-dashboard-layout-20260916">
/* VEA_FIX_DASHBOARD_LAYOUT_20260916 */
#filtrosVigilancia .vea-filtros-dashboard-grid{
  align-items:end!important;
}
#filtrosVigilancia .vea-filtros-dashboard-grid > div{
  min-width:0!important;
}
#filtrosVigilancia .vea-filtros-dashboard-grid > div > label{
  min-height:1rem!important;
  display:flex!important;
  align-items:flex-end!important;
  margin-bottom:.375rem!important;
  line-height:1!important;
}
#filtrosVigilancia .vea-filtros-dashboard-grid #btnDropdownAnios,
#filtrosVigilancia .vea-filtros-dashboard-grid select{
  height:42px!important;
  min-height:42px!important;
  box-sizing:border-box!important;
}
#filtrosVigilancia .vea-filtros-dashboard-grid .vea-filtros-acciones{
  height:42px!important;
  display:flex!important;
  align-items:stretch!important;
  gap:.5rem!important;
}
#filtrosVigilancia .vea-filtros-dashboard-grid .vea-filtros-acciones > button{
  height:42px!important;
  margin:0!important;
}
html[data-vea-theme="light"] #filtrosVigilancia .vea-filtros-dashboard-grid #btnDropdownAnios,
html[data-vea-theme="light"] #filtrosVigilancia .vea-filtros-dashboard-grid select{
  background:#f8fafc!important;
}
</style>
'''
          if 'vea-fix-dashboard-layout-20260916' not in s:
              s = s.replace('</head>', css + '\n</head>', 1)

          if '<\\/script>' not in s:
              raise SystemExit('ERROR: no quedó protegido el cierre interno del boletín.')
          if 'vea-filtros-dashboard-grid' not in s:
              raise SystemExit('ERROR: no quedó la nueva clase de filtros.')
          if 'VEA_FIX_DASHBOARD_LAYOUT_20260916' not in s:
              raise SystemExit('ERROR: no quedó el CSS de alineación.')

          p.write_text(s, encoding='utf-8')
          print('OK: corrupción reparada + filtros alineados')
          PY

      - name: Validación estructural
        shell: bash
        run: |
          grep -q 'VEA_FIX_DASHBOARD_LAYOUT_20260916' index.html
          grep -q 'vea-filtros-dashboard-grid' index.html
          grep -q '<\\/script>' index.html
          grep -q 'F6_20_MASTER_DINAMICO_CACHE_V2' index.html
          echo 'Validación OK'

      - name: Publicar
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'VEA: reparar corrupción de script y alinear filtros del dashboard'
          git push

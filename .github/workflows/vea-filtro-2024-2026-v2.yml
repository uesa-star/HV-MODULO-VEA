name: VEA filtro completo de años y reparación dashboard
on:
  push:
    paths:
      - '.github/workflows/vea-filtro-2024-2026-v2.yml'
      - 'index.html'
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'VEA: reparar corrupción de script y alinear filtros del dashboard') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar correcciones controladas
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # 1. Filtro visible: TODOS los años disponibles.
          pattern=r'(function\s+tresAniosMasRecientesVea\s*\(anios\)\s*\{).*?(\n\s*\})'
          m=re.search(pattern,s,re.S)
          if not m:
              raise SystemExit('No se encontró la función del filtro de años.')
          nuevo='function tresAniosMasRecientesVea(anios) {\n            // El filtro visible ofrece TODOS los años disponibles.\n            return normalizarListaAniosVea(anios).sort((a, b) => a - b);\n        }'
          s=s[:m.start()]+nuevo+s[m.end():]

          # 2. CRÍTICO: proteger el cierre </script> interno del boletín.
          old="""  window.addEventListener('load',()=>{aplicar();setTimeout(aplicar,600);setTimeout(aplicar,1800)});
  })();
</script>
</body></html>`;"""
          new="""  window.addEventListener('load',()=>{aplicar();setTimeout(aplicar,600);setTimeout(aplicar,1800)});
  })();
<\\/script>
</body></html>`;"""
          if old in s:
              s=s.replace(old,new,1)
          elif '<\\/script>' not in s:
              raise SystemExit('No se encontró el cierre interno del boletín.')

          # 3. Alinear año/mes/semana y acciones.
          old_grid='grid grid-cols-1 md:grid-cols-2 lg:grid-cols-[1fr_1fr_1fr_auto] gap-4 lg:items-end'
          new_grid='grid vea-filtros-dashboard-grid grid-cols-1 md:grid-cols-2 lg:grid-cols-[1.15fr_1fr_1fr_auto] gap-4 lg:items-end'
          if old_grid in s:
              s=s.replace(old_grid,new_grid,1)

          css='''
<style id="vea-fix-dashboard-layout-20260916">
/* VEA_FIX_DASHBOARD_LAYOUT_20260916 */
#filtrosVigilancia .vea-filtros-dashboard-grid{align-items:end!important}
#filtrosVigilancia .vea-filtros-dashboard-grid>div{min-width:0!important}
#filtrosVigilancia .vea-filtros-dashboard-grid>div>label{min-height:1rem!important;display:flex!important;align-items:flex-end!important;margin-bottom:.375rem!important;line-height:1!important}
#filtrosVigilancia .vea-filtros-dashboard-grid #btnDropdownAnios,
#filtrosVigilancia .vea-filtros-dashboard-grid select{height:42px!important;min-height:42px!important;box-sizing:border-box!important}
#filtrosVigilancia .vea-filtros-dashboard-grid .vea-filtros-acciones{height:42px!important;display:flex!important;align-items:stretch!important;gap:.5rem!important}
#filtrosVigilancia .vea-filtros-dashboard-grid .vea-filtros-acciones>button{height:42px!important;margin:0!important}
</style>
'''
          if 'vea-fix-dashboard-layout-20260916' not in s:
              s=s.replace('</head>',css+'\n</head>',1)

          if 'VEA_FIX_FILTRO_ANIOS_COMPLETO_20260915' not in s:
              s=s.replace('<style id="vea-fix-dashboard-layout-20260916">','<!-- VEA_FIX_FILTRO_ANIOS_COMPLETO_20260915 -->\n<style id="vea-fix-dashboard-layout-20260916">',1)
          if 'F6_20_MASTER_DINAMICO_CACHE_V2' not in s:
              raise SystemExit('Firma F6.20 ausente.')
          if 'return normalizarListaAniosVea(anios).sort((a, b) => a - b);' not in s:
              raise SystemExit('La regla completa de años no quedó aplicada.')
          if 'VEA_FIX_DASHBOARD_LAYOUT_20260916' not in s:
              raise SystemExit('No quedó el ajuste de alineación.')
          if '<\\/script>' not in s:
              raise SystemExit('No quedó protegido el cierre interno.')
          p.write_text(s,encoding='utf-8')
          print('OK: años completos + corrupción reparada + filtros alineados')
          PY
      - name: Validar
        run: |
          grep -q 'VEA_FIX_DASHBOARD_LAYOUT_20260916' index.html
          grep -q 'VEA_FIX_FILTRO_ANIOS_COMPLETO_20260915' index.html
          grep -q 'return normalizarListaAniosVea(anios).sort((a, b) => a - b);' index.html
          grep -q '<\\/script>' index.html
          grep -q 'F6_20_MASTER_DINAMICO_CACHE_V2' index.html
      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then echo 'Sin cambios'; exit 0; fi
          git commit -m "VEA: reparar corrupción de script y alinear filtros del dashboard"
          git push

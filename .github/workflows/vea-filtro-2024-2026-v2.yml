name: VEA filtro completo de años
on:
  push:
    paths:
      - '.github/workflows/vea-filtro-2024-2026-v2.yml'
      - 'index.html'
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'VEA: corregir filtro completo de años') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar filtro completo de años
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = """        function tresAniosMasRecientesVea(anios) {
              return normalizarListaAniosVea(anios).sort((a, b) => b - a).slice(0, 3).sort((a, b) => a - b);
          }
"""
          new = """        function tresAniosMasRecientesVea(anios) {
              // Compatibilidad histórica del nombre: el filtro visible debe ofrecer TODOS los años disponibles.
              return normalizarListaAniosVea(anios).sort((a, b) => a - b);
          }
"""
          if old not in s:
              raise SystemExit('No se encontro el bloque de tres años; no se publica ningún cambio.')
          s = s.replace(old, new, 1)
          marker = 'VEA_FIX_FILTRO_ANIOS_COMPLETO_20260915'
          if marker not in s:
              s = s.replace('</head>', f'<!-- {marker} -->\n</head>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validar
        run: |
          grep -q 'VEA_FIX_FILTRO_ANIOS_COMPLETO_20260915' index.html
          grep -q 'return normalizarListaAniosVea(anios).sort((a, b) => a - b);' index.html
          grep -q 'F6_20_MASTER_DINAMICO_CACHE_V2' index.html
      - name: Commit reparación
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "VEA: corregir filtro completo de años"
          git push

name: VEA filtro completo de años
on:
  push:
    paths:
      - '.github/workflows/vea-filtro-2024-2026-v2.yml'
      - 'index.html'
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'VEA: publicar filtro completo de años') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar filtro completo de años
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          pattern=r'(function\s+tresAniosMasRecientesVea\s*\(anios\)\s*\{).*?(\n\s*\})'
          m=re.search(pattern,s,re.S)
          if not m:
              raise SystemExit('No se encontró la función del filtro de años.')
          bloque=m.group(0)
          nuevo='function tresAniosMasRecientesVea(anios) {\n            // Compatibilidad histórica: el filtro visible ofrece TODOS los años disponibles.\n            return normalizarListaAniosVea(anios).sort((a, b) => a - b);\n        }'
          s=s[:m.start()]+nuevo+s[m.end():]
          css='''\n<style id="vea-fix-filtro-anios-visual-20260915">\n/* VEA_FIX_FILTRO_ANIOS_COMPLETO_20260915 */\n#dropdownAniosContent{width:100%!important;max-height:22rem!important;overflow-y:auto!important;overflow-x:hidden!important;box-sizing:border-box!important;z-index:80!important}\n#dropdownAniosContent label{min-height:2.45rem;box-sizing:border-box}\n#dropdownAniosContent::-webkit-scrollbar{width:5px}\n@media(max-width:767px){#dropdownAniosContent{max-height:18rem!important}}\n</style>\n'''
          if 'vea-fix-filtro-anios-visual-20260915' not in s:
              s=s.replace('</head>',css+'</head>',1)
          if 'F6_20_MASTER_DINAMICO_CACHE_V2' not in s:
              raise SystemExit('Firma F6.20 ausente.')
          if 'return normalizarListaAniosVea(anios).sort((a, b) => a - b);' not in s:
              raise SystemExit('La regla de todos los años no quedó aplicada.')
          p.write_text(s,encoding='utf-8')
          print('OK: filtro completo de años aplicado')
          PY
      - name: Validar
        run: |
          grep -q 'VEA_FIX_FILTRO_ANIOS_COMPLETO_20260915' index.html
          grep -q 'return normalizarListaAniosVea(anios).sort((a, b) => a - b);' index.html
          grep -q 'F6_20_MASTER_DINAMICO_CACHE_V2' index.html
      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then echo 'Sin cambios'; exit 0; fi
          git commit -m "VEA: publicar filtro completo de años"
          git push

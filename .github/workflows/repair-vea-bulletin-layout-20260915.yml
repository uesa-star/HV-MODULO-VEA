name: VEA reparar boletín y alineación

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Aplicar reparación controlada
        run: python scripts/repair_vea_bulletin_layout_20260915.py

      - name: Validar y publicar reparación
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html scripts/repair_vea_bulletin_layout_20260915.py .github/workflows/repair-vea-bulletin-layout-20260915.yml
          if git diff --cached --quiet; then
            echo "Sin cambios; la reparación ya está aplicada."
            exit 0
          fi
          git commit -m "VEA: reparar boletin y layout"
          git push

name: VEA normalizacion definitiva 20260916
on:
  push:
    paths:
      - '.github/workflows/vea-normalizacion-definitiva-20260916.yml'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar normalización
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='VEA_NORMALIZACION_DEFINITIVA_20260916'
          if marker in s:
              raise SystemExit('YA_APLICADO')
          css='''
<style id="vea-normalizacion-definitiva-20260916">
/* VEA_NORMALIZACION_DEFINITIVA_20260916 */
#veaAppShell>main{box-sizing:border-box!important;width:100%!important;max-width:96rem!important;min-width:0!important;margin-left:auto!important;margin-right:auto!important}
#veaMasterMenu{display:flex!important;flex-direction:column!important;gap:.4rem!important}
#veaMasterMenu .vea-menu-item{box-sizing:border-box!important;width:100%!important;min-height:42px!important;height:42px!important;margin:0!important;display:flex!important;align-items:center!important}
#btnTabDashboard{order:1!important}#btnTabHospitalizados{order:2!important}#btnTabCasos{order:3!important}#btnTabDatos{order:4!important}
#contentDashboard,#contentCanal,#contentTabla,#contentHospitalizados,#contentCasos,#contentSoat,#contentVih,#contentTbc,#contentConfiguracion,#contentDatos{box-sizing:border-box!important;width:100%!important;max-width:none!important;min-width:0!important;margin-left:0!important;margin-right:0!important}
#contentDashboard>.grid,#contentHospitalizados>.grid{width:100%!important;min-width:0!important;margin-left:0!important;margin-right:0!important;align-items:stretch!important}
#contentDashboard .vea-kpis-regulares>div,#contentHospitalizados>.grid:first-child>div{box-sizing:border-box!important;min-height:166px!important;height:100%!important}
#contentCanal,#contentTabla,#contentCasos,#contentDatos{scroll-margin-top:1rem!important}
#bandaSituacionCompleta,#filtrosVigilancia{box-sizing:border-box!important;width:100%!important;max-width:none!important;margin-left:0!important;margin-right:0!important}
#bandaSituacionCompleta{min-height:64px!important}
#contentDashboard :is(.rounded-xl,.rounded-2xl),#contentHospitalizados :is(.rounded-xl,.rounded-2xl),#contentCasos :is(.rounded-xl,.rounded-2xl),#contentDatos :is(.rounded-xl,.rounded-2xl),#contentCanal :is(.rounded-xl,.rounded-2xl),#contentTabla :is(.rounded-xl,.rounded-2xl){box-sizing:border-box!important;max-width:100%!important}
#contentDashboard canvas,#contentHospitalizados canvas,#contentCasos canvas,#contentDatos canvas,#contentCanal canvas,#contentTabla canvas{max-width:100%!important}
@media(max-width:767px){#veaAppShell>main{width:100%!important;max-width:100%!important;padding-left:.5rem!important;padding-right:.5rem!important}#contentDashboard,#contentCanal,#contentTabla,#contentHospitalizados,#contentCasos,#contentSoat,#contentVih,#contentTbc,#contentConfiguracion,#contentDatos{width:100%!important;max-width:100%!important}#contentDashboard .vea-kpis-regulares>div,#contentHospitalizados>.grid:first-child>div{min-height:0!important;height:auto!important}}
</style>
'''
          if 'F6_20_MASTER_DINAMICO_CACHE_V2' not in s: raise SystemExit('F6.20_AUSENTE')
          if 'VEA_FIX_DASHBOARD_LAYOUT_20260916' not in s: raise SystemExit('CORRECCION_DASHBOARD_AUSENTE')
          if '</script>\n</body></html>`' in s: raise SystemExit('CIERRE_SCRIPT_PELIGROSO')
          if 'id="contentDashboard"' not in s or 'id="contentHospitalizados"' not in s or 'id="contentCasos"' not in s or 'id="contentDatos"' not in s: raise SystemExit('MODULOS_PRINCIPALES_AUSENTES')
          s=s.replace('</head>',css+'</head>',1)
          p.write_text(s,encoding='utf-8')
          print('NORMALIZACION_OK')
          PY
      - name: Publicar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'VEA: normalizar todos los modulos alineacion orden y sincronizacion visual'
          git push
      - name: Retirar workflow
        if: success()
        run: |
          git rm .github/workflows/vea-normalizacion-definitiva-20260916.yml
          git commit -m 'VEA: retirar workflow temporal de normalizacion'
          git push
